name: Build Scroll frontend image

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ['scroll-v*']

permissions:
  contents: read

concurrency:
  group: scroll-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  credentials:
    name: Test Access credentials
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: node --test tests/scroll-*.test.mjs

  image:
    name: Build and publish
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name == 'pull_request' }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # Closed PR events can have a read-only Actions cache token. Use the
          # registry credentials already used to publish the image instead.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-linux-amd64
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-linux-amd64,mode=max,image-manifest=true,oci-mediatypes=true
